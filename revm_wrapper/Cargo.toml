[package]
name = "thrylos-revm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
revm = { version = "12.1", features = ["std", "serde"] }
revm-primitives = { version = "7.1", features = ["std", "serde"] }
alloy-primitives = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1.0"
parking_lot = "0.12.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" 
