version: "3.8"

services:
  node-1:
    build: .
    container_name: thrylos-node-1
    hostname: node-1
    environment:
      - NODE_ID=1
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - THRYLOS_ENVIRONMENT=development
    ports:
      - "8080:8081"
      - "9001:9000"
    volumes:
      - node1-data:/app/data
      - node1-keys:/app/keys
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  node-2:
    build: .
    container_name: thrylos-node-2
    hostname: node-2
    environment:
      - NODE_ID=2
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - BOOTSTRAP_PEERS=/ip4/172.25.0.10/tcp/9000
      - THRYLOS_ENVIRONMENT=development
    ports:
      - "8081:8081"
      - "9002:9000"
    volumes:
      - node2-data:/app/data
      - node2-keys:/app/keys
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.11
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  node-3:
    build: .
    container_name: thrylos-node-3
    hostname: node-3
    environment:
      - NODE_ID=3
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - BOOTSTRAP_PEERS=/ip4/172.25.0.10/tcp/9000,/ip4/172.25.0.11/tcp/9000
      - THRYLOS_ENVIRONMENT=development
    ports:
      - "8082:8081"
      - "9003:9000"
    volumes:
      - node3-data:/app/data
      - node3-keys:/app/keys
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.12
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  node-4:
    build: .
    platform: linux/amd64
    container_name: thrylos-node-4
    hostname: node-4
    environment:
      - NODE_ID=4
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - BOOTSTRAP_PEERS=/ip4/172.25.0.10/tcp/9000
      - THRYLOS_ENVIRONMENT=development
    ports:
      - "8083:8081"
      - "9004:9000"
    volumes:
      - node4-data:/app/data
      - node4-keys:/app/keys
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.13
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  node1-data:
  node1-keys:
  node2-data:
  node2-keys:
  node3-data:
  node3-keys:
  node4-data:
  node4-keys:

networks:
  thrylos-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1