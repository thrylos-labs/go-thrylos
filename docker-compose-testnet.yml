version: "3.8"

# -----------------------------------------------------------------------
# Thrylos Testnet — docker-compose
#
# FIND-05: TLS is now enabled by default for the API server.
# Each node expects a cert and key mounted into /app/certs/ at runtime.
# Generate per-node certs with the script in certs/README.md.
#
# FIND-04: Bootstrap peer IDs are resolved dynamically (no hardcoding).
# -----------------------------------------------------------------------

services:
  node-1:
    build: .
    container_name: thrylos-node-1
    hostname: node-1
    environment:
      - NODE_ID=1
      - CHAIN_ID=thrylos-devnet-1337
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - THRYLOS_ENVIRONMENT=development
      - POINTS_FILE_PATH=/app/data/points.json
      # FIND-05: Enable TLS on the API server
      - ENABLE_TLS=true
      - CERT_FILE=/app/certs/server.crt
      - KEY_FILE=/app/certs/server.key
    ports:
      - "8080:8080"
      - "9001:9000"
    volumes:
      - node1-data-v3:/app/data
      - node1-keys-v3:/app/keys
      - shared-config-v3:/app/config
      # FIND-05: Mount TLS cert/key (generated locally, gitignored)
      - ./certs/node1:/app/certs:ro
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  peer-id-resolver:
    image: alpine:latest
    container_name: thrylos-peer-id-resolver
    depends_on:
      node-1:
        condition: service_healthy
    networks:
      - thrylos-net
    volumes:
      - shared-config-v3:/app/config
    command: >
      sh -c "
        apk add --no-cache curl &&
        PEER_ID=$(curl -sk https://172.25.0.10:8080/api/v1/peer-id) &&
        echo \"/ip4/172.25.0.10/tcp/9000/p2p/$${PEER_ID}\" > /app/config/bootstrap_peers.txt &&
        echo \"Bootstrap peer resolved: $${PEER_ID}\"
      "
    restart: "no"

  node-2:
    build: .
    container_name: thrylos-node-2
    hostname: node-2
    environment:
      - NODE_ID=2
      - CHAIN_ID=thrylos-devnet-1337
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - THRYLOS_ENVIRONMENT=development
      - BOOTSTRAP_PEERS_FILE=/app/config/bootstrap_peers.txt
      - ENABLE_TLS=true
      - CERT_FILE=/app/certs/server.crt
      - KEY_FILE=/app/certs/server.key
    ports:
      - "8081:8080"
      - "9002:9000"
    volumes:
      - node2-data-v3:/app/data
      - node2-keys-v3:/app/keys
      - shared-config-v3:/app/config
      - ./certs/node2:/app/certs:ro
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.11
    depends_on:
      peer-id-resolver:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  node-3:
    build: .
    container_name: thrylos-node-3
    hostname: node-3
    environment:
      - NODE_ID=3
      - CHAIN_ID=thrylos-devnet-1337
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - THRYLOS_ENVIRONMENT=development
      - BOOTSTRAP_PEERS_FILE=/app/config/bootstrap_peers.txt
      - ENABLE_TLS=true
      - CERT_FILE=/app/certs/server.crt
      - KEY_FILE=/app/certs/server.key
    ports:
      - "8082:8080"
      - "9003:9000"
    volumes:
      - node3-data-v3:/app/data
      - node3-keys-v3:/app/keys
      - shared-config-v3:/app/config
      - ./certs/node3:/app/certs:ro
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.12
    depends_on:
      peer-id-resolver:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  node-4:
    build: .
    platform: linux/amd64
    container_name: thrylos-node-4
    hostname: node-4
    environment:
      - NODE_ID=4
      - CHAIN_ID=thrylos-devnet-1337
      - P2P_PORT=9000
      - DATA_DIR=/app/data
      - THRYLOS_ENVIRONMENT=development
      - BOOTSTRAP_PEERS_FILE=/app/config/bootstrap_peers.txt
      - ENABLE_TLS=true
      - CERT_FILE=/app/certs/server.crt
      - KEY_FILE=/app/certs/server.key
    ports:
      - "8083:8080"
      - "9004:9000"
    volumes:
      - node4-data-v3:/app/data
      - node4-keys-v3:/app/keys
      - shared-config-v3:/app/config
      - ./certs/node4:/app/certs:ro
    networks:
      thrylos-net:
        ipv4_address: 172.25.0.13
    depends_on:
      peer-id-resolver:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  node1-data-v3:
  node1-keys-v3:
  node2-data-v3:
  node2-keys-v3:
  node3-data-v3:
  node3-keys-v3:
  node4-data-v3:
  node4-keys-v3:
  shared-config-v3:

networks:
  thrylos-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
