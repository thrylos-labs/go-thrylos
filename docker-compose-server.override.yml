# -----------------------------------------------------------------------
# Thrylos server override
#
# Usage:
#   docker-compose -f docker-compose-testnet.yml -f docker-compose-server.override.yml up
#
# This override flips the local HTTP testnet stack back to HTTPS for
# server-style deployments where real certificates are mounted.
# -----------------------------------------------------------------------

services:
  node-1:
    environment:
      - ENABLE_TLS=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8080/api/v1/health >/dev/null || exit 1"]

  peer-id-resolver:
    command: >
      sh -c "
        apk add --no-cache curl &&
        PEER_ID=$(curl -sk https://172.25.0.10:8080/api/v1/peer-id) &&
        echo \"/ip4/172.25.0.10/tcp/9000/p2p/$${PEER_ID}\" > /app/config/bootstrap_peers.txt &&
        echo \"Bootstrap peer resolved: $${PEER_ID}\"
      "

  node-2:
    environment:
      - ENABLE_TLS=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8080/api/v1/health >/dev/null || exit 1"]

  node-3:
    environment:
      - ENABLE_TLS=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8080/api/v1/health >/dev/null || exit 1"]

  node-4:
    environment:
      - ENABLE_TLS=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8080/api/v1/health >/dev/null || exit 1"]
