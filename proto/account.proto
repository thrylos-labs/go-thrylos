// protoc --go_out=. --go_opt=paths=source_relative proto/account.proto (remember to move into proto/core)

syntax = "proto3";

package thrylos.core;

option go_package = "github.com/thrylos-labs/thrylos-v2/proto/core";

message Account {
  string address = 1;
  string balance = 2;            
  uint64 nonce = 3;
  string staked_amount = 4;       // ⚠️ CHANGED: int64 -> string (Must match balance precision)
  map<string, string> delegated_to = 5; // ⚠️ CHANGED: map<string, int64> -> map<string, string>
  string rewards = 6;             // ⚠️ CHANGED: int64 -> string
  bytes code_hash = 7; 
  bytes storage_root = 8; 
}

message Transaction {
  string id           = 1;
  string from         = 2;
  string to           = 3;
  string amount       = 4;     
  int64  gas          = 5;       
  string gas_price    = 6;      
  uint64 nonce        = 7;
  bytes  data         = 8;
  TransactionType type = 9;
  bytes  signature    = 10;
  string hash         = 11;
  int64  timestamp    = 12;
  bytes  from_pubkey  = 13;
  string chain_id     = 14;
}

enum TransactionType {
  TRANSFER = 0;
  STAKE = 1;
  UNSTAKE = 2;
  DELEGATE = 3;
  UNDELEGATE = 4;
  CLAIM_REWARDS = 5;
  EVM_CONTRACT_CALL = 6;
  EVM_CONTRACT_DEPLOY = 7;
}

message Block {
  BlockHeader header = 1;
  repeated Transaction transactions = 2;
  string hash = 3;
  bytes signature = 4;
  bytes proposal_signature = 5;  // ADD THIS
}

message BlockHeader {
  int64 index = 1;
  string prev_hash = 2;
  int64 timestamp = 3;
  string validator = 4;
  string tx_root = 5;
  string state_root = 6;
  int64 gas_used = 7;
  int64 gas_limit = 8;
  uint64 slot = 9;
  uint64 epoch = 10;
  string total_fees = 11;
  string merkle_root = 12;
  bytes vrf_output = 13;  // VRF randomness output
  bytes vrf_proof = 14;   // VRF proof for verification
}

message Validator {
  string address = 1;
  bytes pubkey = 2;
  string name = 3; // Add validator name
  string description = 4; // Add validator description
  string website = 5; // Add validator website
  string stake = 6; // Updated field numbers
  string self_stake = 7;
  string delegated_stake = 8;
  map<string, string> delegators = 9; // delegator address -> amount
  double commission = 10; // commission rate (0.0 to 1.0)
  bool active = 11;
  int64 blocks_proposed = 12;
  int64 blocks_missed = 13;
  int64 jail_until = 14; // Unix timestamp, 0 means not jailed
  int64 created_at = 15; // When validator was created
  int64 updated_at = 16; // Last update timestamp
}

// You might also want to add validator-related transaction types
enum ValidatorTransactionType {
  CREATE_VALIDATOR = 0;
  EDIT_VALIDATOR = 1;
  UNJAIL_VALIDATOR = 2;
}

// And potentially a ValidatorSet message for consensus
message ValidatorSet {
  repeated Validator validators = 1;
  int64 total_voting_power = 2;
  int64 height = 3; // Block height this validator set is for
}
